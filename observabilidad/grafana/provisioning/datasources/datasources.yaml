apiVersion: 1
datasources:
  - { name: Prometheus, type: prometheus, uid: prometheus, url: http://prometheus:9090, isDefault: true }
  - { name: Jaeger,     type: jaeger,     uid: jaeger,     url: http://jaeger:16686 }
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      # Cada log trae trace_id: este enlace abre la traza en Jaeger ("Ver traza").
      derivedFields:
        - name: Ver traza
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: jaeger
